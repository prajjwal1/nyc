name: Freshness Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: freshness-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compare repository and deployed freshness
        id: freshness
        env:
          LIVE_EVENTS_URL: https://prajjwal1.github.io/nyc/events.json
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from datetime import datetime, timezone

          def parse(value):
              if not value:
                  return None
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  return parsed if parsed.tzinfo else parsed.replace(tzinfo=timezone.utc)
              except ValueError:
                  return None

          try:
              repo = json.load(open("data/events.json"))
          except Exception as exc:
              print(f"repository payload unavailable: {exc}")
              repo = {}
          try:
              request = urllib.request.Request(
                  f"{os.environ['LIVE_EVENTS_URL']}?freshness={int(time.time())}",
                  headers={"Cache-Control": "no-cache", "User-Agent": "nyc-events-freshness-monitor"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  live = json.load(response)
          except Exception as exc:
              print(f"deployed payload unavailable: {exc}")
              live = {}

          now = datetime.now(timezone.utc)
          repo_time = parse(repo.get("lastUpdated"))
          live_time = parse(live.get("lastUpdated"))
          repo_age = (now - repo_time).total_seconds() / 60 if repo_time else None
          live_age = (now - live_time).total_seconds() / 60 if live_time else None
          print(f"repository age: {repo_age:.1f} min" if repo_age is not None else "repository timestamp missing")
          print(f"deployed age: {live_age:.1f} min" if live_age is not None else "deployed timestamp missing")

          catalogs = (repo.get("ingestionStats") or {}).get("platformCatalogs") or {}
          luma = catalogs.get("luma") or {}
          partiful = catalogs.get("partiful") or {}
          platform_bad = (
              int(luma.get("fetched") or 0) == 0
              or int(partiful.get("fetched") or 0) == 0
              or (luma.get("advertised") and float(luma.get("coverage") or 0) < 0.8)
          )
          scrape_needed = repo_age is None or repo_age > 45
          deploy_needed = live_age is None or live_age > 60 or (
              repo_time is not None and (live_time is None or live_time < repo_time)
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"scrape_needed={'true' if scrape_needed else 'false'}\n")
              output.write(f"platform_needed={'true' if scrape_needed or platform_bad else 'false'}\n")
              output.write(f"deploy_needed={'true' if deploy_needed else 'false'}\n")
          PY

      - name: Dispatch recovery workflows without duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
          SCRAPE_NEEDED: ${{ steps.freshness.outputs.scrape_needed }}
          PLATFORM_NEEDED: ${{ steps.freshness.outputs.platform_needed }}
          DEPLOY_NEEDED: ${{ steps.freshness.outputs.deploy_needed }}
        run: |
          dispatch_if_idle() {
            workflow="$1"
            active="$(gh run list --workflow "$workflow" --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
            if [ "$active" = "0" ]; then
              gh workflow run "$workflow" --ref main
              echo "dispatched $workflow"
            else
              echo "$workflow already active"
            fi
          }
          if [ "$SCRAPE_NEEDED" = "true" ]; then dispatch_if_idle quick-scrape.yml; fi
          if [ "$PLATFORM_NEEDED" = "true" ]; then dispatch_if_idle platform-refresh.yml; fi
          if [ "$DEPLOY_NEEDED" = "true" ]; then dispatch_if_idle deploy.yml; fi
