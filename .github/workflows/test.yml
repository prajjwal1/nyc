name: Tests

# Runs the scraper unit tests. These lock in the behavior of the pure
# parsing/extraction utilities (quality filters, normalize pipeline, event
# parser, substack pin-marker parser, instagram spot/roundup logic) so a
# regression is caught before it ships into a scrape.

on:
  push:
    paths:
      - "scrapers/**"
      - "site/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scrapers/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r scrapers/requirements.txt
          pip install pytest

      - name: Run scraper unit tests
        run: python -m pytest scrapers/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Lint and build
        working-directory: site
        run: |
          npm run lint
          npm run build

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run UI checks
        working-directory: site
        run: npm run test:ui
