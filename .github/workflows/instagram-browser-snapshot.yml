name: Process local Instagram snapshot

on:
  push:
    paths:
      - "scrapers/data/instagram_browser_snapshot.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instagram-browser-snapshot
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scrapers/requirements.txt
      - name: Process snapshot with current sources
        env:
          IG_BROWSER_ONLY: "1"
        run: python -m scrapers.run_all
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          .github/scripts/safe-pull.sh data/events.json site/public/events.json data/communities.json site/public/communities.json scrapers/data/stats_history.jsonl
          git add data/events.json site/public/events.json data/communities.json site/public/communities.json scrapers/data/stats_history.jsonl
          git diff --cached --quiet || git commit -m "Process local Instagram snapshot"
          git push

      - name: Deploy refreshed feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
