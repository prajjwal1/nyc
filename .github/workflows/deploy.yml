name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/events.json"
      - "data/communities.json"
  schedule:
    # GitHub Actions does NOT trigger workflows for commits made by
    # GITHUB_TOKEN (the bot account our scrape workflows use). Without a
    # cron, the site only deploys when a human pushes site/** changes —
    # which is why events on the live site were stuck weeks behind the
    # data in repo. Hourly cron forces a redeploy with current events.
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Only the newest site snapshot matters. A stale queued build must never
  # prevent a fresh events/community snapshot from reaching production.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      expected_updated: ${{ steps.snapshot.outputs.expected_updated }}
    steps:
      - uses: actions/checkout@v4

      - name: Record data snapshot
        id: snapshot
        run: echo "expected_updated=$(jq -r '.lastUpdated' data/events.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Copy public data
        run: |
          cp data/events.json site/public/events.json
          cp data/communities.json site/public/communities.json

      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed data matches the repository snapshot
        env:
          EXPECTED_UPDATED: ${{ needs.build.outputs.expected_updated }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from datetime import datetime

          expected = datetime.fromisoformat(os.environ["EXPECTED_UPDATED"].replace("Z", "+00:00"))
          last_error = None
          for attempt in range(12):
              try:
                  url = f"https://prajjwal1.github.io/nyc/events.json?deploy={int(time.time())}"
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  actual = datetime.fromisoformat(payload["lastUpdated"].replace("Z", "+00:00"))
                  print(f"expected {expected.isoformat()}, deployed {actual.isoformat()}")
                  if actual >= expected:
                      raise SystemExit(0)
                  last_error = f"deployed timestamp {actual.isoformat()} is behind"
              except Exception as exc:
                  last_error = str(exc)
              time.sleep(10)
          raise SystemExit(f"deployment verification failed: {last_error}")
          PY
